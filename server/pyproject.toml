[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ltms-server"
version = "0.1.0"
description = "Long-Term Memory Server — append-only tamper-evident record store"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pynacl>=1.5",
    "PyYAML>=6.0",
    "bcrypt>=4.1",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["server", "tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.setuptools]
packages = ["server", "server.models", "server.security", "server.security.hash", "server.services", "server.api"]
