name: Attribution

# Every agent PR must say which harness, model and machine did the work
# (AGENTS.md rule 9), so squash commits on main record it. Human PRs pass with
# `Agent-Harness: none`, or with no block when no commit has an agent trailer and
# the PR has no `agent-task` label. Logic and tests: .github/scripts/check_attribution.py,
# server/tests/test_ci_scripts.py (issue #389). Re-runs when the description or labels change.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the attribution block
        env:
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --format='%B%x00' "$BASE..$HEAD" > /tmp/commits
          COMMITS_FILE=/tmp/commits python3 .github/scripts/check_attribution.py
