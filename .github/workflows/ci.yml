name: CI

# Issue #389. Pull requests run only the jobs a change can affect (see the
# `changes` job) and a short Python matrix: 3.12 (production, Dockerfile) on
# SQLite and PostgreSQL plus the schema check, and 3.14 on SQLite to catch
# upcoming breakage. Pushes to main, the nightly schedule and manual runs use
# the full 3.11-3.14 x SQLite/PostgreSQL matrix. `ci-ok` sums up every job and
# is the check the branch ruleset requires, so matrix changes never touch it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"  # nightly, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    # Which jobs this change can affect. Outside pull requests everything runs.
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.diff.outputs.python }}
      dashboard: ${{ steps.diff.outputs.dashboard }}
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$BASE...$HEAD" | tee /tmp/changed.txt
            python3 .github/scripts/ci_changes.py < /tmp/changed.txt | tee -a "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/ci_changes.py --all | tee -a "$GITHUB_OUTPUT"
          fi

  tests:
    name: tests (py${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12", "3.14"]' || '["3.11", "3.12", "3.13", "3.14"]') }}
    env:
      # On pull requests only the production version runs PostgreSQL and the schema check.
      FULL: ${{ github.event_name != 'pull_request' || matrix.python == '3.12' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ltms
          POSTGRES_PASSWORD: ltms
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ltms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
      - run: pip install -e '.[dev,docs,media]'
      - name: pytest (SQLite)
        run: pytest -n auto
      - name: pytest (PostgreSQL 16)
        if: env.FULL == 'true'
        env:
          LTMS_TEST_DATABASE_URL: postgresql+asyncpg://ltms:ltms@localhost:5432/postgres
        run: pytest -n auto
      - name: schema.sql applies cleanly
        if: env.FULL == 'true'
        env:
          PGPASSWORD: ltms
        run: |
          psql -h localhost -U ltms -d postgres -c "CREATE DATABASE schemacheck"
          psql -h localhost -U ltms -d schemacheck -v ON_ERROR_STOP=1 -q -f config/schema.sql

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy-scripts:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=warning deploy/*.sh
      - name: systemd units are valid
        # Stand-in app folder outside /home (the unit sets ProtectHome=true, and on the
        # server the app lives under /var/www/vhosts). /bin/true stands in for uvicorn;
        # note `command -v true` would return the shell builtin, not a file.
        run: |
          APP=/srv/ltms-app
          sudo mkdir -p "$APP/.venv/bin" && sudo ln -sf /bin/true "$APP/.venv/bin/uvicorn"
          sudo ln -sf /bin/true "$APP/.venv/bin/python"   # ExecStartPre (migrations)
          for t in deploy/*.template; do
            sed -e "s#@APP_DIR@#$APP#g" -e "s#@RUN_USER@#$(id -un)#g" -e "s#@RUN_GROUP@#$(id -gn)#g" "$t" > "/tmp/$(basename "${t%.template}")"
          done
          cp deploy/ltms-restart.service /tmp/
          systemd-analyze verify /tmp/ltms.service /tmp/ltms-restart.path /tmp/ltms-restart.service

  contract-guard:
    # The record contract is frozen. A PR that touches it must carry the
    # "contract-change" label, which only the owner should add.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check protected files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          protected='^(CONTRACT\.md|ltms_contract/(canonical|record)\.py|ltms_contract/vectors\.json|scripts/make_vectors\.py)$'
          changed=$(git diff --name-only "$BASE" "$HEAD" | grep -E "$protected" || true)
          if [ -z "$changed" ]; then echo "No protected files changed."; exit 0; fi
          echo "Protected contract files changed:"; echo "$changed"
          case ",$LABELS," in
            *,contract-change,*) echo "Label contract-change present: allowed."; exit 0 ;;
          esac
          echo "::error::These files define the frozen record contract. Revert the changes, or ask the owner to add the 'contract-change' label."
          exit 1

  ci-ok:
    # The one check the ruleset needs besides contract-guard. Fails if any job
    # failed or was cancelled; a job skipped because the change can't affect it passes.
    if: always()
    needs: [changes, tests, dashboard, deploy-scripts, contract-guard]
    runs-on: ubuntu-latest
    steps:
      - name: Sum up job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {name: job["result"] for name, job in needs.items()
                 if job["result"] not in ("success", "skipped")}
          for name, job in sorted(needs.items()):
              print(f"{name}: {job['result']}")
          if bad:
              print("::error::Failed or cancelled: " + ", ".join(f"{n} ({r})" for n, r in sorted(bad.items())))
              sys.exit(1)
          print("All jobs passed or were skipped.")
          PY

  nightly-report:
    # A scheduled run that fails opens one issue, or comments on it if it's still open.
    needs: [tests, dashboard, deploy-scripts]
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly CI failed";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The nightly full-matrix run failed on ${context.sha.slice(0, 7)}: ${url}`;
            const open = await github.paginate(github.rest.issues.listForRepo,
              { ...context.repo, state: "open", creator: "github-actions[bot]", per_page: 100 });
            const existing = open.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              core.info(`Commented on #${existing.number}`);
            } else {
              const { data } = await github.rest.issues.create({ ...context.repo, title,
                body: `${body}\n\nClose this issue once main is green again; the next failure opens a new one.` });
              core.info(`Opened #${data.number}`);
            }
