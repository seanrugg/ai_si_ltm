# Docker Compose stack for LTMS.
#
# Default (no profiles): LTMS + Postgres.
#   cp deploy/compose/.env.example .env     # then edit .env
#   docker compose up -d
#
# Settings: .env is the one settings file. Every LTMS setting set there reaches
# the ltms container (the list below is generated by scripts/dump_settings.py
# and a test keeps it complete); other services' secrets don't. See
# docs/configuration.md.
#
# Optional services, opt-in through profiles (see docs/docker.md):
#   --profile mqtt   Mosquitto broker for swarm hubs and members
#   --profile lrs    Yet Analytics SQL LRS with its own Postgres
# LTMS works without either. Any xAPI-conformant LRS can be connected instead;
# an admin adds LRS endpoints in LTMS.
#
# LTMS and the LRS publish on 127.0.0.1 only by default. Put a TLS reverse
# proxy in front before exposing them, or set LTMS_BIND / LRS_BIND in .env.
# LTMS creates its own schema on start.
#
# Every service restarts with the Docker daemon (host reboot, Docker package
# upgrade) unless you stopped it yourself, and keeps at most 30 MB of container
# logs (#437). See docs/docker.md, "Host updates and reboots".

x-restart: &restart unless-stopped
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    restart: *restart
    logging: *logging
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${LTMS_DB_NAME}
      POSTGRES_USER: ${LTMS_DB_USER}
      POSTGRES_PASSWORD: ${LTMS_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LTMS_DB_USER} -d ${LTMS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ltms:
    restart: *restart
    logging: *logging
    image: ${LTMS_IMAGE:-ghcr.io/seanrugg/ai_si_ltm:latest}
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Settings shared with other services, or fixed by this file, come first.
    # The rest is generated: every LTMS setting in .env reaches the container
    # (#390). Only LTMS settings are passed, never other services' secrets.
    environment:
      LTMS_DATABASE_URL: postgresql+asyncpg://${LTMS_DB_USER}:${LTMS_DB_PASSWORD}@db:5432/${LTMS_DB_NAME}
      LTMS_ADMIN_USERNAME: ${LTMS_ADMIN_USERNAME}
      LTMS_ADMIN_PASSWORD: ${LTMS_ADMIN_PASSWORD}
      LTMS_COOKIE_SECURE: ${LTMS_COOKIE_SECURE}
      LTMS_SECRET_KEY: ${LTMS_SECRET_KEY}
      LTMS_DASHBOARD_DIR: /app/dashboard/dist
      LTMS_DATA_DIR: /data
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # >>> generated by scripts/dump_settings.py; do not edit between these lines
      # Every other LTMS setting, passed from .env when set there (docs/configuration.md).
      # Empty values are ignored, so the defaults apply.
      LTMS_SCHEMA_MODE: ${LTMS_SCHEMA_MODE:-}
      LTMS_TOKEN_TTL_SECONDS: ${LTMS_TOKEN_TTL_SECONDS:-}
      LTMS_ADMIN_IDLE_MINUTES: ${LTMS_ADMIN_IDLE_MINUTES:-}
      LTMS_ADMIN_SESSION_MAX_HOURS: ${LTMS_ADMIN_SESSION_MAX_HOURS:-}
      LTMS_ADMIN_WARN_MINUTES: ${LTMS_ADMIN_WARN_MINUTES:-}
      LTMS_ADMIN_IDLE_MAX_MINUTES: ${LTMS_ADMIN_IDLE_MAX_MINUTES:-}
      LTMS_CHALLENGE_TTL_SECONDS: ${LTMS_CHALLENGE_TTL_SECONDS:-}
      LTMS_FUTURE_SKEW_SECONDS: ${LTMS_FUTURE_SKEW_SECONDS:-}
      LTMS_INGEST_RATE: ${LTMS_INGEST_RATE:-}
      LTMS_RECALL_RATE: ${LTMS_RECALL_RATE:-}
      LTMS_MAX_BATCH: ${LTMS_MAX_BATCH:-}
      LTMS_MAX_RECALL: ${LTMS_MAX_RECALL:-}
      LTMS_ENROLL_RATE_PER_IP: ${LTMS_ENROLL_RATE_PER_IP:-}
      LTMS_MAX_PENDING_ENROLLMENTS: ${LTMS_MAX_PENDING_ENROLLMENTS:-}
      LTMS_RETENTION_PAYLOAD_RULES: ${LTMS_RETENTION_PAYLOAD_RULES:-}
      LTMS_RETENTION_AUDIT_DAYS: ${LTMS_RETENTION_AUDIT_DAYS:-}
      LTMS_ADDRESS_HISTORY_DAYS: ${LTMS_ADDRESS_HISTORY_DAYS:-}
      LTMS_ENABLE_SCHEDULER: ${LTMS_ENABLE_SCHEDULER:-}
      LTMS_LRS_BOOTSTRAP_URL: ${LTMS_LRS_BOOTSTRAP_URL:-}
      LTMS_LRS_BOOTSTRAP_NAME: ${LTMS_LRS_BOOTSTRAP_NAME:-}
      LTMS_LRS_BOOTSTRAP_USERNAME: ${LTMS_LRS_BOOTSTRAP_USERNAME:-}
      LTMS_LRS_BOOTSTRAP_SECRET: ${LTMS_LRS_BOOTSTRAP_SECRET:-}
      LTMS_LRS_BOOTSTRAP_XAPI_VERSION: ${LTMS_LRS_BOOTSTRAP_XAPI_VERSION:-}
      LTMS_LRS_BOOTSTRAP_TYPES: ${LTMS_LRS_BOOTSTRAP_TYPES:-}
      LTMS_LRS_BOOTSTRAP_ENABLED: ${LTMS_LRS_BOOTSTRAP_ENABLED:-}
      LTMS_LRS_FORWARD_SECONDS: ${LTMS_LRS_FORWARD_SECONDS:-}
      LTMS_LRS_BATCH_SIZE: ${LTMS_LRS_BATCH_SIZE:-}
      LTMS_LRS_MAX_BATCHES_PER_RUN: ${LTMS_LRS_MAX_BATCHES_PER_RUN:-}
      LTMS_PUBLIC_BASE_URL: ${LTMS_PUBLIC_BASE_URL:-}
      LTMS_MCP_READ_MODE: ${LTMS_MCP_READ_MODE:-}
      LTMS_MCP_OPEN_SCOPE: ${LTMS_MCP_OPEN_SCOPE:-}
      LTMS_MCP_SETTINGS_LOCKED: ${LTMS_MCP_SETTINGS_LOCKED:-}
      LTMS_ENROLLMENT_POLICY: ${LTMS_ENROLLMENT_POLICY:-}
      LTMS_ENROLLMENT_POLICY_LOCKED: ${LTMS_ENROLLMENT_POLICY_LOCKED:-}
      LTMS_RETENTION_LOCKED: ${LTMS_RETENTION_LOCKED:-}
      LTMS_FLEET_KEY_PATH: ${LTMS_FLEET_KEY_PATH:-}
      LTMS_DATASET_TEXT_MAX_MB: ${LTMS_DATASET_TEXT_MAX_MB:-}
      LTMS_DATASET_UPLOAD_MAX_MB: ${LTMS_DATASET_UPLOAD_MAX_MB:-}
      LTMS_DATASET_URL_ALLOW: ${LTMS_DATASET_URL_ALLOW:-}
      LTMS_LRS_MSG_SUMMARY_PER_HOUR: ${LTMS_LRS_MSG_SUMMARY_PER_HOUR:-}
      LTMS_LRS_MSG_SUMMARY_SUSTAIN_HOURS: ${LTMS_LRS_MSG_SUMMARY_SUSTAIN_HOURS:-}
      LTMS_LRS_MSG_SUMMARY_WINDOW_MINUTES: ${LTMS_LRS_MSG_SUMMARY_WINDOW_MINUTES:-}
      LTMS_REFERENCE_REFRESH_HOURS: ${LTMS_REFERENCE_REFRESH_HOURS:-}
      LTMS_CHARTER_GRACE_DAYS: ${LTMS_CHARTER_GRACE_DAYS:-}
      LTMS_GEOIP_DB: ${LTMS_GEOIP_DB:-}
      LTMS_GEOIP_REFRESH_DAYS: ${LTMS_GEOIP_REFRESH_DAYS:-}
      LTMS_PENDING_ENROLLMENT_TTL_DAYS: ${LTMS_PENDING_ENROLLMENT_TTL_DAYS:-}
      # <<< end of generated settings
    ports:
      - "${LTMS_BIND:-127.0.0.1}:${LTMS_PORT:-8080}:8080"
    volumes:
      - ltms-backups:/backups
      - ltms-data:/data  # fleet datasets (#237)

  # Optional MQTT broker for swarms. Members connect on the local network,
  # so it listens on all interfaces; authentication is required.
  mqtt:
    restart: *restart
    logging: *logging
    image: eclipse-mosquitto:2
    profiles: [mqtt]
    volumes:
      - ./deploy/compose/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/compose/mosquitto.passwd:/mosquitto/config/passwd:ro
      - ./deploy/compose/mosquitto.acl:/mosquitto/config/acl:ro
      - mqtt-data:/mosquitto/data
    ports:
      - "${MQTT_PORT:-1883}:1883"

  # Optional xAPI LRS: Yet Analytics SQL LRS, as in its own compose example.
  # Pin LRSQL_IMAGE to a release tag for anything beyond a trial.
  lrs-db:
    restart: *restart
    logging: *logging
    image: postgres:16
    profiles: [lrs]
    volumes:
      - lrs-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${LRSQL_DB_NAME:-lrsql}
      POSTGRES_USER: ${LRSQL_DB_USER:-lrsql}
      POSTGRES_PASSWORD: ${LRSQL_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LRSQL_DB_USER:-lrsql} -d ${LRSQL_DB_NAME:-lrsql}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  lrs:
    restart: *restart
    logging: *logging
    image: ${LRSQL_IMAGE:-yetanalytics/lrsql:latest}
    profiles: [lrs]
    command: /lrsql/bin/run_postgres.sh
    depends_on:
      lrs-db:
        condition: service_healthy
    environment:
      LRSQL_DB_HOST: lrs-db
      LRSQL_DB_NAME: ${LRSQL_DB_NAME:-lrsql}
      LRSQL_DB_USER: ${LRSQL_DB_USER:-lrsql}
      LRSQL_DB_PASSWORD: ${LRSQL_DB_PASSWORD}
      LRSQL_ADMIN_USER_DEFAULT: ${LRSQL_ADMIN_USER}
      LRSQL_ADMIN_PASS_DEFAULT: ${LRSQL_ADMIN_PASS}
      LRSQL_API_KEY_DEFAULT: ${LRSQL_API_KEY}
      LRSQL_API_SECRET_DEFAULT: ${LRSQL_API_SECRET}
      LRSQL_POOL_INITIALIZATION_FAIL_TIMEOUT: "10000"
      LRSQL_ALLOW_ALL_ORIGINS: "false"
      # The public address of the admin UI (e.g. https://lrs.example.org) when it
      # sits behind a reverse proxy; without it, browser logins get 403.
      LRSQL_ALLOWED_ORIGINS: ${LRSQL_ALLOWED_ORIGINS:-}
    ports:
      - "${LRS_BIND:-127.0.0.1}:${LRS_PORT:-8081}:8080"

volumes:
  db-data:
  mqtt-data:
  lrs-db-data:
  ltms-backups:
  ltms-data:
