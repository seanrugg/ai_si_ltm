# Docker Compose stack for LTMS.
#
# Default (no profiles): LTMS + Postgres.
#   cp deploy/compose/.env.example .env     # then edit .env
#   docker compose up -d
#
# Optional services, opt-in through profiles (see docs/docker.md):
#   --profile mqtt   Mosquitto broker for swarm hubs and members
#   --profile lrs    Yet Analytics SQL LRS with its own Postgres
# LTMS works without either. Any xAPI-conformant LRS can be connected instead;
# an admin adds LRS endpoints in LTMS.
#
# LTMS and the LRS publish on 127.0.0.1 only by default. Put a TLS reverse
# proxy in front before exposing them, or set LTMS_BIND / LRS_BIND in .env.
# LTMS creates its own schema on start.

services:
  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${LTMS_DB_NAME}
      POSTGRES_USER: ${LTMS_DB_USER}
      POSTGRES_PASSWORD: ${LTMS_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LTMS_DB_USER} -d ${LTMS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ltms:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      LTMS_DATABASE_URL: postgresql+asyncpg://${LTMS_DB_USER}:${LTMS_DB_PASSWORD}@db:5432/${LTMS_DB_NAME}
      LTMS_ADMIN_USERNAME: ${LTMS_ADMIN_USERNAME}
      LTMS_ADMIN_PASSWORD: ${LTMS_ADMIN_PASSWORD}
      LTMS_COOKIE_SECURE: ${LTMS_COOKIE_SECURE}
      LTMS_SECRET_KEY: ${LTMS_SECRET_KEY}
      LTMS_DASHBOARD_DIR: /app/dashboard/dist
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      LTMS_LRS_BOOTSTRAP_URL: ${LTMS_LRS_BOOTSTRAP_URL:-}
      LTMS_LRS_BOOTSTRAP_NAME: ${LTMS_LRS_BOOTSTRAP_NAME:-}
      LTMS_LRS_BOOTSTRAP_USERNAME: ${LTMS_LRS_BOOTSTRAP_USERNAME:-}
      LTMS_LRS_BOOTSTRAP_SECRET: ${LTMS_LRS_BOOTSTRAP_SECRET:-}
      LTMS_LRS_BOOTSTRAP_TYPES: ${LTMS_LRS_BOOTSTRAP_TYPES:-}
      LTMS_LRS_BOOTSTRAP_XAPI_VERSION: ${LTMS_LRS_BOOTSTRAP_XAPI_VERSION:-}
      LTMS_LRS_BOOTSTRAP_ENABLED: ${LTMS_LRS_BOOTSTRAP_ENABLED:-}
    ports:
      - "${LTMS_BIND:-127.0.0.1}:${LTMS_PORT:-8080}:8080"

  # Optional MQTT broker for swarms. Members connect on the local network,
  # so it listens on all interfaces; authentication is required.
  mqtt:
    image: eclipse-mosquitto:2
    profiles: [mqtt]
    volumes:
      - ./deploy/compose/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/compose/mosquitto.passwd:/mosquitto/config/passwd:ro
      - ./deploy/compose/mosquitto.acl:/mosquitto/config/acl:ro
      - mqtt-data:/mosquitto/data
    ports:
      - "${MQTT_PORT:-1883}:1883"

  # Optional xAPI LRS: Yet Analytics SQL LRS, as in its own compose example.
  # Pin LRSQL_IMAGE to a release tag for anything beyond a trial.
  lrs-db:
    image: postgres:16
    profiles: [lrs]
    volumes:
      - lrs-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${LRSQL_DB_NAME:-lrsql}
      POSTGRES_USER: ${LRSQL_DB_USER:-lrsql}
      POSTGRES_PASSWORD: ${LRSQL_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LRSQL_DB_USER:-lrsql} -d ${LRSQL_DB_NAME:-lrsql}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  lrs:
    image: ${LRSQL_IMAGE:-yetanalytics/lrsql:latest}
    profiles: [lrs]
    command: /lrsql/bin/run_postgres.sh
    depends_on:
      lrs-db:
        condition: service_healthy
    environment:
      LRSQL_DB_HOST: lrs-db
      LRSQL_DB_NAME: ${LRSQL_DB_NAME:-lrsql}
      LRSQL_DB_USER: ${LRSQL_DB_USER:-lrsql}
      LRSQL_DB_PASSWORD: ${LRSQL_DB_PASSWORD}
      LRSQL_ADMIN_USER_DEFAULT: ${LRSQL_ADMIN_USER}
      LRSQL_ADMIN_PASS_DEFAULT: ${LRSQL_ADMIN_PASS}
      LRSQL_API_KEY_DEFAULT: ${LRSQL_API_KEY}
      LRSQL_API_SECRET_DEFAULT: ${LRSQL_API_SECRET}
      LRSQL_POOL_INITIALIZATION_FAIL_TIMEOUT: "10000"
      LRSQL_ALLOW_ALL_ORIGINS: "false"
    ports:
      - "${LRS_BIND:-127.0.0.1}:${LRS_PORT:-8081}:8080"

volumes:
  db-data:
  mqtt-data:
  lrs-db-data:
