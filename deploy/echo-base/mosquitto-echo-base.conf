# Goes in /etc/mosquitto/conf.d/ on the Jetson (Mosquitto 2.x).
# listener 1883 binds all interfaces: it must only be reachable on the home LAN,
# never port-forwarded to the internet.
listener 1883
allow_anonymous false
password_file /etc/mosquitto/echo-base.passwd
acl_file /etc/mosquitto/echo-base.acl
persistence true
