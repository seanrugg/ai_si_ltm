# Mosquitto 2.x config for the LTMS compose stack (profile mqtt).
#
# Mounted at /mosquitto/config/mosquitto.conf by compose.yaml.
#
# listener 1883 binds all interfaces: it must only be reachable on the local
# network, never port-forwarded to the internet.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/

# compose.yaml mounts deploy/compose/mosquitto.passwd and mosquitto.acl.
# Create both before `docker compose --profile mqtt up` (see docs/docker.md);
# they hold credentials and are git-ignored.
