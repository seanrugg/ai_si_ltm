# Mosquitto 2.x config for the LTMS compose stack (profile mqtt).
#
# Mounted at /mosquitto/config/mosquitto.conf by compose.yaml.
#
# listener 1883 binds all interfaces: it must only be reachable on the local
# network, never port-forwarded to the internet.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
# persistence_location /mosquitto/data

# Authentication: create /mosquitto/config/passwd (e.g. with mosquitto_passwd)
# and mount it alongside this conf. The compose file mounts only mosquitto.conf;
# add the passwd and acl mounts when you enable the mqtt profile.

# ACL: copy the access-control rules from examples/echo-base/deploy/echo-base.acl
# (or deploy/echo-base if the examples move has merged) into
# deploy/compose/acl and mount it at /mosquitto/config/acl. The example ACL lets
# a hub read/write all records/acks and lets each member touch only its own
# topics; adjust it to your swarm.
