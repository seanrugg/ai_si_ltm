# Paste into Plesk: Domains -> <ltms subdomain> -> Apache & nginx Settings ->
# "Additional nginx directives". Proxy mode must be OFF (see the plan, Step 6).

client_max_body_size 2m;          # record batches are small; 100 records x 64 KiB max payload fits easily

add_header Strict-Transport-Security "max-age=31536000" always;   # the app sets the other security headers

location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Dataset uploads (#237, #244, #245): a file up to the 25 MB text limit in one
# request, or an 8 MB chunk of a resumable upload. Document extraction can take
# up to 30 s, so allow more time than the default.
location /api/admin/datasets/ {
    client_max_body_size 26m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
