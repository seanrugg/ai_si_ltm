# Hermes Agent reads a plugin's Python dependencies from this file and installs
# them into its own environment when the plugin is enabled or updated (#478).
# The LTMS client code (cli_agent, ltms_contract) is not listed: the plugin finds
# it in the checkout it is linked from. See ../README.md.
[project]
name = "ltms-recorder-hermes-plugin"
version = "0.3.0"
description = "Hermes Agent plugin: signed LTMS records of sessions and tool calls, plus a daily usage rollup"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5",
    "httpx>=0.27",
]
