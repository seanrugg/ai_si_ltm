# Default configuration. Environment variables override these (see config.py).
server:
  host: 0.0.0.0
  port: 8080
  # Single-worker by default. See "Concurrency" in the architecture plan:
  # horizontal scaling (uvicorn --workers N) is only safe with a Postgres-backed
  # limiter + SELECT for UPDATE locking; document it before enabling.
  workers: 1

auth:
  token_ttl_seconds: 300     # 5 min
  admin_session_ttl_seconds: 1800   # 30 min
  max_replay_sec: 45         # /api/auth/challenge nonce window (bump to 90 if needed)
  clock_skew_sec: 3600       # ts may not exceed this from now()

rate_limits:
  ingest_requests_per_second: 10
  recall_requests_per_second: 5
  max_batch: 100
  max_recall: 200
  enroll_per_ip: 5           # /api/auth/enroll capacity per remote IP
  challenge_per_ip: 10       # /api/auth/challenge capacity per remote IP

retention:
  events_days: 90
  keyframes_days: 30
  audit_days: 365
  rollup_at_local: "03:00"
  purge_keyframes_at_local: "04:00"
  audit_prune_weekday: 0     # Monday
