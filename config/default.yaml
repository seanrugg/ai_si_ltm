# LTMS defaults. Every key can be overridden by an environment variable named
# LTMS_<KEY> in upper case (e.g. LTMS_TOKEN_TTL_SECONDS=600).
# Secrets (LTMS_DB_PASSWORD, LTMS_ADMIN_PASSWORD) have no defaults here.

# Database. LTMS_DATABASE_URL, if set, wins over the LTMS_DB_* parts.
db_host: localhost
db_port: 5432
db_name: ltms
db_user: ltms

# Auth
admin_username: admin
token_ttl_seconds: 300          # member bearer token lifetime
admin_session_ttl_seconds: 1800 # admin cookie lifetime (30 min)
challenge_ttl_seconds: 60       # /api/auth/challenge nonce lifetime
future_skew_seconds: 300        # reject record ts further than this in the future
cookie_secure: true             # set false only for local http development

# Limits (per member unless noted)
ingest_rate: 10                 # ingest requests/s
recall_rate: 5                  # recall requests/s
max_batch: 100                  # records per POST /api/records
max_recall: 200                 # records per GET /api/records
enroll_rate_per_ip: 5           # enroll requests per IP per hour
max_pending_enrollments: 20     # refuse new enroll requests beyond this

# Retention (days)
# Payload purge rules. Headers (summary, time, place, chain) are kept forever;
# only the payload (raw details) of a matching record is deleted after `days`.
# A rule matches on type, tag, or both. Records tagged `keep` are never purged.
# Policy and system payloads can't be purged. Env override, as JSON:
#   LTMS_RETENTION_PAYLOAD_RULES='[{"tag":"telemetry","days":14}]'
retention_payload_rules:
  - {type: event, days: 90}
  - {type: perception, days: 90}
  - {tag: telemetry, days: 30}       # sensor windows of any type
retention_audit_days: 365
