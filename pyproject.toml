[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ltms"
version = "0.2.0"
description = "Long-Term Memory Server: append-only, signed, tamper-evident memory for an AI/robot mesh"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pynacl>=1.5",
    "PyYAML>=6.0",
    "bcrypt>=4.1",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "cryptography>=42",  # issue #59: encrypted LRS credentials
    "alembic>=1.13",  # issue #97: database migrations
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "aiosqlite>=0.20"]
hub = ["paho-mqtt>=2,<3"]  # Jetson hub entrypoint: cli_agent.hub_main
mcp = ["mcp>=2,<3"]  # ltms_mcp uses MCPServer, added in mcp 2.0

[tool.setuptools.packages.find]
include = ["ltms_contract*", "server*", "cli_agent*", "ltms_mcp*"]
exclude = ["server.tests*"]

[tool.setuptools.package-data]
ltms_contract = ["vectors.json"]
server = ["migrations/sql/*.sql"]  # issue #97: migration SQL shipped with the package

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
